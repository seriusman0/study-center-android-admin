appId: com.studycenter.admin.study_center_admin
---
- runScript: generate_names.js
- launchApp
- extendedWaitUntil:
    visible:
      text: ".*(Masuk|Dashboard).*"
    timeout: 30000

- runFlow:
    when:
      visible: "Masuk"
    file: login.yaml

# Open Drawer
- tapOn:
    point: 8%, 8%

- tapOn: "Cabang"
- assertVisible: "Manajemen Cabang"

# Add Cabang
- tapOn: "Tambah Cabang"
- assertVisible: "Tambah Cabang"
- tapOn:
    id: "input_nama_cabang"
- inputText: ${output.cabangName}
- tapOn:
    id: "input_alamat_cabang"
- inputText: "Alamat Maestro"
- tapOn: "Simpan"

# Check if added
- scrollUntilVisible:
    element:
      text: ".*${output.cabangName}.*"
    direction: DOWN
    timeout: 30000
- assertNotVisible: "Cabang disimpan"

# Edit Cabang
- swipe:
    direction: UP
- tapOn: ".*${output.cabangName}.*"
- tapOn: ".*${output.cabangName}.*"
- assertVisible: "Batal"
- tapOn:
    id: "input_nama_cabang"
- eraseText: 50
- inputText: "${output.cabangName} Diedit"
- tapOn:
    id: "input_alamat_cabang"
- tapOn: "Simpan"

# Delete Cabang
- scrollUntilVisible:
    element:
      text: ".*${output.cabangName} Diedit.*"
    direction: DOWN
    timeout: 30000
- assertNotVisible: "Cabang disimpan"
- swipe:
    direction: UP
- tapOn: ".*${output.cabangName} Diedit.*"
- tapOn:
    id: "delete_${output.cabangName} Diedit"
- assertVisible: "Batal"
- tapOn: "Hapus"
- assertNotVisible: ".*${output.cabangName} Diedit.*"
